server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI service (k8s DNS)
    location /api/ {
        proxy_pass http://dev-strom-api.devstrom.svc.cluster.local:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs { proxy_pass http://dev-strom-api.devstrom.svc.cluster.local:8000; }
    location /openapi.json { proxy_pass http://dev-strom-api.devstrom.svc.cluster.local:8000/openapi.json; }
}
