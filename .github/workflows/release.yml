name: Release

# Builds and pushes both images to ghcr.io on a version tag, then opens a
# PR against Tecurious/Tecurious-Infra bumping the image tags so ArgoCD
# deploys. Nothing deploys until that PR is merged (main is the deploy
# trigger — ArgoCD tracks main only).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dev-strom-api
            context: .
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-infra:
    name: open tag-bump PR on Tecurious-Infra
    runs-on: ubuntu-latest
    needs: build-push
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Tecurious/Tecurious-Infra
          token: ${{ secrets.INFRA_PAT }}
          ref: main

      - name: Bump image tags
        run: |
          sed -i "s#image: ghcr.io/tecurious/dev-strom-api:.*#image: ghcr.io/tecurious/dev-strom-api:${VERSION}#" \
            infrastructure/apps/dev-strom/api-deployment.yaml \
            infrastructure/apps/dev-strom/migration-job.yaml
          git diff --stat

      # REST instead of `gh pr create`: fine-grained PATs cannot use the
      # GraphQL pullRequests object gh relies on, but REST PR creation only
      # needs Contents:write.
      - name: Open PR
        env:
          INFRA_PAT: ${{ secrets.INFRA_PAT }}
        run: |
          BRANCH="bump/dev-strom-${VERSION}"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "bump dev-strom to ${VERSION}" || exit 0
          git push origin "$BRANCH"
          curl -sf -X POST \
            -H "Authorization: token ${INFRA_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Tecurious/Tecurious-Infra/pulls \
            -d "$(jq -n --arg h "$BRANCH" --arg t "bump dev-strom to ${VERSION}" \
              '{title:$t, head:$h, base:"main", auto_merge:true,
                body:("Automated tag bump from Dev-strom release ${VERSION}. Auto-merges — ArgoCD picks it up from main.")}')"
